<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Azade · Off the trail</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #F6F0E4; color: #1F1915; font: 1.05rem/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; padding: 2rem; box-sizing: border-box; }
    .blaze { inline-size: 3.5rem; block-size: 1.6rem; margin: 0 auto 1.5rem; position: relative; background: linear-gradient(#fff 0 46%, #C8312B 46%); border: 1px solid #E4D9C6; }
    .blaze::after { content: ""; position: absolute; inset: -0.6rem 1.4rem; background: #C8312B; transform: rotate(45deg); box-shadow: 0 0 0 2px #F6F0E4; inline-size: 0.35rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p { margin: .25rem 0; color: #3E342C; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="blaze" aria-hidden="true"></div>
    <h1>Off the trail 🐐</h1>
    <p>This page doesn't exist, or it wandered off.</p>
    <p lang="fr">Hors sentier : cette page n'existe pas, ou elle est partie brouter ailleurs.</p>
    <p><a href="/">Back to the path</a> · <a href="/fr" lang="fr">Retour au sentier</a></p>
  </main>
</body>
</html>
